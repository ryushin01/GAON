name: PC 설치본

# 태그를 올리거나 직접 실행하면 Windows와 macOS 설치본을 만들고, 만든 앱을 실제로 실행해 검사합니다.
# 태그에서 실행하면 두 운영체제가 모두 통과했을 때 GitHub Release로 공개합니다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
            executable: release/win-unpacked/GAON.exe
            artifact: release/*.exe
          - os: macos-latest
            target: --mac dmg --arm64
            executable: release/mac-arm64/GAON.app/Contents/MacOS/GAON
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 태그와 버전 기록 확인
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/release-notes.mjs "$TAG" > /dev/null
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pip install numpy soundfile pillow
      - run: python scripts/generate-media.py public-media
      - name: 검사용 빌드
        shell: bash
        run: |
          EXPO_PUBLIC_MEDIA_BASE_URL=http://localhost:8787 pnpm build:web
          pnpm exec electron-builder --config electron-builder.json ${{ matrix.target }} --publish never
      - name: 설치본 실행 검사
        run: pnpm exec playwright test --project=desktop-app
        env:
          GAON_EXECUTABLE: ${{ matrix.executable }}
      - name: 배포용 빌드 (공개 미디어 주소)
        run: |
          pnpm build:web
          pnpm exec electron-builder --config electron-builder.json ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: gaon-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: GitHub Release 공개
        run: bash scripts/publish-release.sh "$TAG" assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
