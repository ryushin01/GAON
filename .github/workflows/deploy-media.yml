name: 미디어와 웹 배포

# 설치한 앱이 스트리밍하는 공개 카탈로그와 FLAC을 GitHub Pages에 올립니다. 웹 데모도 함께 올립니다.
on:
  push:
    branches: [main]
    paths:
      - scripts/generate-media.py
      - src/**
      - app/**
      - public/**
      - app.json
      - .github/workflows/deploy-media.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install numpy soundfile pillow
      - run: python scripts/generate-media.py site/media
      - run: pnpm install --frozen-lockfile
      - name: 웹 데모 빌드 (/GAON 경로)
        # 저장소 변수가 없으면 로그인이 꺼진 채로 빌드됩니다. 공개용 키라 화면 코드에 들어가도 됩니다.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e "const f='app.json',c=require('./'+f);c.expo.experiments.baseUrl='/GAON';require('fs').writeFileSync(f,JSON.stringify(c))"
          pnpm exec expo export --platform web --output-dir web-out
          cp -R web-out/. site/
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 공개 미디어가 커서 Pages 동기화가 기본 10분을 넘깁니다.
          timeout: 1800000
