name: 미디어와 웹 배포

# 설치한 앱이 스트리밍하는 공개 카탈로그와 FLAC을 GitHub Pages에 올립니다. 웹 데모도 함께 올립니다.
on:
  push:
    branches: [main]
    paths:
      - scripts/generate-media.py
      - src/**
      - app/**
      - public/**
      - app.json
      - .github/workflows/deploy-media.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy soundfile pillow
      - run: python scripts/generate-media.py site/media
      - run: pnpm install --frozen-lockfile
      - name: 웹 데모 빌드 (/GAON 경로)
        run: |
          node -e "const f='app.json',c=require('./'+f);c.expo.experiments.baseUrl='/GAON';require('fs').writeFileSync(f,JSON.stringify(c))"
          pnpm exec expo export --platform web --output-dir web-out
          cp -R web-out/. site/
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
