<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F5" />
    <meta name="description" content="고해상도 FLAC 음악 스트리밍 앱 GAON" />
    <title>GAON</title>
    <script>
      // 앱에서 고른 테마를 첫 화면에도 적용합니다. 저장값은 features/change-theme이 씁니다.
      try {
        var preference = JSON.parse(localStorage.getItem('gaon-theme')).state.preference;
        if (preference === 'light' || preference === 'dark') document.documentElement.dataset.theme = preference;
      } catch (error) {}
    </script>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #F4F4F5; color: #09090B; }
      #root { display: flex; height: 100%; flex: 1; }
      .boot { margin: auto; font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 3px; }
      :root[data-theme="dark"] body { background: #09090B; color: #FAFAFA; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #09090B; color: #FAFAFA; } }
      :focus-visible { outline: 3px solid #2F7BFF !important; outline-offset: 2px; }
      .skip-link { position: fixed; top: 8px; left: 8px; z-index: 1000; padding: 12px 16px; background: #09090B; color: #fff; font: 600 16px system-ui, sans-serif; transform: translateY(-200%); }
      .skip-link:focus { transform: none; }
    </style>
  </head>
  <body>
    <noscript>GAON을 사용하려면 JavaScript를 켜 주세요.</noscript>
    <!-- 스크립트를 받는 동안 빈 화면 대신 보여 줍니다. 앱이 그려지면 이 내용을 대체합니다. -->
    <div id="root"><p class="boot">GAON</p></div>
  </body>
</html>
